name: Backend Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/api-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Critical backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run critical backend tests
        working-directory: backend
        run: >
          python -m pytest
          tests/test_deployment.py
          tests/test_financial_transactions.py
          tests/test_dashboard.py
          tests/test_import_batches.py
          tests/test_exports.py
